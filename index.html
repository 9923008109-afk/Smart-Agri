<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>Smart Agriculture Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Chart.js (UMD – safest for GitHub Pages) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
:root{
  --bg:#020617;
  --card:#020617;
  --border:#1e293b;
  --accent:#38bdf8;
}
body{
  margin:0;
  font-family:Segoe UI,Arial;
  background:#020617;
  color:#e5e7eb;
}
.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.login-card{
  background:var(--card);
  padding:30px;
  width:330px;
  border-radius:12px;
  box-shadow:0 0 20px rgba(56,189,248,.35);
}
.login-card h2{text-align:center;color:var(--accent)}
input,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
  border:none;
}
button{
  background:var(--accent);
  font-weight:bold;
  cursor:pointer;
}
header{
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}
.badge{
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}
.admin{background:#22c55e;color:black}
.user{background:#facc15;color:black}
.container{
  padding:18px;
  max-width:1200px;
  margin:auto;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
}
.card h3{margin-top:0;color:#93c5fd}
.logout{
  background:#ef4444;
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
}
canvas{
  background:#fff;
  border-radius:8px;
  padding:10px;
  width:100%;
  height:280px;
}
.top-actions{
  display:flex;
  gap:10px;
  align-items:center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="center" id="loginPage">
  <div class="login-card">
    <h2>🔐 Smart Agri Login</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="msg"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">
<header>
  <div>
    Smart Agriculture Dashboard
    <span id="roleBadge" class="badge"></span>
  </div>
  <div class="top-actions">
    <span class="logout" onclick="logout()">Logout</span>
  </div>
</header>

<div class="container">

<!-- USER VIEW -->
<div id="userView">
  <div class="grid">

    <div class="card">
      <h3>📅 அடுத்த மாதம் சிறந்த பயிர்</h3>
      🌾 <b id="nextCrop">--</b><br><br>
      🌿 இயற்கை உரம்:<br>
      <b id="fertilizer">--</b>
    </div>

    <div class="card">
      <h3>🌱 நில தகவல் (LIVE)</h3>
      <div id="liveData">Waiting for data…</div>
    </div>

    <div class="card">
      <h3>📊 பருவ விளைச்சல்</h3>
      <canvas id="seasonChart"></canvas>
    </div>

  </div>
</div>

<!-- ADMIN VIEW -->
<div id="adminView" style="margin-top:20px;display:none">
  <div class="card">
    <h3>👑 User-1 Field Data (Graph)</h3>
    <canvas id="adminChart"></canvas>
  </div>
</div>

</div>
</div>

<!-- FIREBASE + LOGIC -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

/* ---------- Firebase config ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDoqjMw4D-7_GOs0rlFL8oYzInMU8dh2FU",
  authDomain: "smart-agri-4d47c.firebaseapp.com",
  databaseURL: "https://smart-agri-4d47c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "smart-agri-4d47c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ---------- Globals ---------- */
let role = "";
let adminChart = null;
let seasonChart = null;

/* ---------- Login (frontend only) ---------- */
window.login = () => {
  if (username.value === "admin" && password.value === "admin123") {
    role = "admin";
    showDashboard();
  } else if (username.value === "user" && password.value === "user123") {
    role = "user";
    showDashboard();
  } else {
    msg.innerText = "❌ தவறான Login";
    msg.style.color = "red";
  }
};

function showDashboard(){
  loginPage.style.display = "none";
  dashboard.style.display = "block";
  roleBadge.innerText = role.toUpperCase();
  roleBadge.className = "badge " + role;
  adminView.style.display = (role === "admin") ? "block" : "none";
}

/* ---------- Month-based crop logic ---------- */
function recommendCrop(d){
  const m = new Date().getMonth() + 1;

  if (m>=6 && m<=9 && d.soilMoist>55)
    return { crop:"நெல் (Rice)", fert:"பஞ்சகவ்யா + மாட்டு சாணம்" };

  if (m>=2 && m<=3 && d.soilMoist<45)
    return { crop:"கடலை (Groundnut)", fert:"வேப்பம் புண்ணாக்கு" };

  if (m>=4 && m<=5)
    return { crop:"சோளம் (Maize)", fert:"ஜீவாமிர்தம்" };

  return { crop:"காய்கறிகள்", fert:"கம்போஸ்ட் உரம்" };
}

/* ---------- Firebase listeners ---------- */
window.addEventListener("DOMContentLoaded", () => {

  /* Field live data */
  onValue(ref(db,"agri/field1"), snap => {
    const d = snap.val();
    if (!d) {
      liveData.innerText = "❌ Firebase data not found";
      return;
    }

    liveData.innerHTML = `
      🌱 மண் ஈரப்பதம்: <b>${d.soilMoist}%</b><br>
      🌡 வெப்பநிலை: <b>${d.soilTemp}°C</b><br>
      💧 ஈரப்பதம்: <b>${d.humidity}%</b><br>
      🧪 நைட்ரேட்: <b>${d.nitrate}</b><br>
      ⚡ மின்னல்: <b>${d.lightning?.level ?? "-"}</b>
    `;

    const rec = recommendCrop(d);
    nextCrop.innerText = rec.crop;
    fertilizer.innerText = rec.fert;

    if (role === "admin") {
      if (adminChart) adminChart.destroy();
      adminChart = new Chart(adminChartEl, {
        type:"bar",
        data:{
          labels:["Soil","Temp","Humidity","Nitrate"],
          datasets:[{
            label:"User-1 Field Data",
            data:[d.soilMoist,d.soilTemp,d.humidity,d.nitrate],
            backgroundColor:"#22c55e"
          }]
        },
        options:{responsive:true}
      });
    }
  });

  /* Seasonal chart */
  onValue(ref(db,"agri/seasonal"), snap => {
    const s = snap.val();
    if (!s) return;

    if (seasonChart) seasonChart.destroy();
    seasonChart = new Chart(seasonChartEl, {
      type:"line",
      data:{
        labels:Object.keys(s),
        datasets:[{
          label:"Seasonal Yield %",
          data:Object.values(s),
          borderColor:"#38bdf8",
          fill:false
        }]
      },
      options:{responsive:true}
    });
  });

});

/* ---------- Logout ---------- */
window.logout = () => {
  dashboard.style.display = "none";
  loginPage.style.display = "flex";
};
</script>

</body>
</html>
