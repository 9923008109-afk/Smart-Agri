<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Users Data - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      min-height: 100vh;
    }

    .navbar {
      background: #020617;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      color: #38bdf8;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-link {
      color: #cbd5e1;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .nav-link:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    .nav-link.active {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
    }

    .logout-btn {
      padding: 8px 16px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .container {
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      color: #38bdf8;
      margin-bottom: 20px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .user-card {
      background: #020617;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      border: 1px solid rgba(56, 189, 248, 0.1);
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }

    .user-name {
      font-size: 18px;
      color: #38bdf8;
    }

    .user-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-active {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    .status-inactive {
      background: rgba(248, 113, 113, 0.2);
      color: #f87171;
    }

    .sensor-data {
      display: grid;
      gap: 8px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .data-label {
      color: #94a3b8;
    }

    .data-value {
      color: #facc15;
      font-weight: bold;
    }

    .back-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #475569;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 20px;
    }

    .back-btn:hover {
      background: #334155;
    }

    .last-update {
      color: #64748b;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="logo">
      <span>🌱⚡</span>
      <span>Admin Panel</span>
    </div>
    <div class="nav-links">
      <a href="admin-dashboard.html" class="nav-link">Dashboard</a>
      <a href="admin-users.html" class="nav-link active">All Users</a>
      <a href="user-dashboard.html" class="nav-link">Live View</a>
    </div>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <h1>All Users Monitoring Data</h1>
    <p class="subtitle">View real-time data from all registered users</p>

    <div id="usersData" class="users-grid">
      <!-- User cards will be dynamically generated here -->
      <div class="user-card">
        <div class="user-header">
          <span class="user-name">AFNITHA</span>
          <span class="user-status status-active">Active</span>
        </div>
        <div class="sensor-data">
          <div class="data-row">
            <span class="data-label">Soil Moisture:</span>
            <span class="data-value" id="user1_moist">-- %</span>
          </div>
          <div class="data-row">
            <span class="data-label">Soil Temp:</span>
            <span class="data-value" id="user1_temp">-- °C</span>
          </div>
          <div class="data-row">
            <span class="data-label">Air Temp:</span>
            <span class="data-value" id="user1_air">-- °C</span>
          </div>
          <div class="data-row">
            <span class="data-label">Lightning:</span>
            <span class="data-value" id="user1_lightning">--</span>
          </div>
        </div>
        <div class="last-update">Last updated: <span id="user1_update">--</span></div>
      </div>

      <!-- Add more user cards as needed -->
      <!-- In a real system, these would be dynamically generated from a database -->
    </div>

    <a href="admin-dashboard.html" class="back-btn">← Back to Dashboard</a>
  </div>

  <script>
    // Check if user is logged in as admin
    if (localStorage.getItem('loggedIn') !== 'true' || localStorage.getItem('userType') !== 'admin') {
      window.location.href = 'index.html';
    }

    // Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = 'index.html';
    });

    // Simulated user data (in a real system, this would come from Firebase)
    // You can replace this with actual Firebase data fetching
    const users = [
      { id: 1, name: "AFNITHA", status: "active" },
      { id: 2, name: "USER002", status: "active" },
      { id: 3, name: "USER003", status: "inactive" },
      { id: 4, name: "USER004", status: "active" }
    ];

    // In a real implementation, you would fetch this data from Firebase
    // For now, we'll use the main sensor data for demonstration
    async function fetchAllUsersData() {
      // This function would fetch data from different Firebase paths for each user
      // For now, we'll use the same data for demonstration
      
      const response = await fetch('https://smart-agri-4d47c-default-rtdb.asia-southeast1.firebasedatabase.app/agri.json');
      const data = await response.json();
      
      // Update the first user card with real data
      if (data) {
        document.getElementById('user1_moist').textContent = data.soilMoist + ' %';
        document.getElementById('user1_temp').textContent = data.soilTemp + ' °C';
        document.getElementById('user1_air').textContent = data.airTemp + ' °C';
        document.getElementById('user1_lightning').textContent = data.lightning.level;
        
        const now = new Date();
        document.getElementById('user1_update').textContent = 
          now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      }
    }

    // Fetch data on load and every 30 seconds
    fetchAllUsersData();
    setInterval(fetchAllUsersData, 30000);
  </script>
</body>
</html>
