<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Agri Login System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020617;
    color: #e5e7eb;
  }

  .center {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .card {
    background: #020617;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(56,189,248,0.4);
    padding: 30px;
    width: 320px;
    text-align: center;
  }

  h2 {
    color: #38bdf8;
    margin-bottom: 15px;
  }

  input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 5px;
    border: none;
  }

  button {
    width: 100%;
    padding: 10px;
    background: #38bdf8;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #0ea5e9;
  }

  .dashboard {
    display: none;
  }

  header {
    background: #020617;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1e293b;
  }

  .badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
  }

  .admin {
    background: #22c55e;
    color: black;
  }

  .user {
    background: #facc15;
    color: black;
  }

  .content {
    padding: 20px;
  }

  .data-box {
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .logout {
    background: #ef4444;
    color: white;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
  }

  .admin-only {
    border-left: 4px solid #22c55e;
  }
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div class="center" id="loginPage">
  <div class="card">
    <h2>🔐 Smart Agri Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="msg"></p>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div class="dashboard" id="dashboard">
  <header>
    <div>
      <strong>Smart Agriculture Dashboard</strong>
      <span id="roleBadge" class="badge"></span>
    </div>
    <div class="logout" onclick="logout()">Logout</div>
  </header>

  <div class="content">

    <div class="data-box">
      🌱 Soil Moisture: <strong>45%</strong>
    </div>

    <div class="data-box">
      🌡 Soil Temp: <strong>28°C</strong>
    </div>

    <div class="data-box">
      ⚡ Lightning Level: <strong>HIGH</strong>
    </div>

    <div class="data-box">
      ⚡ Intensity: <strong>7</strong>
    </div>

    <!-- ADMIN ONLY -->
    <div class="data-box admin-only" id="adminPanel">
      👑 Admin Control Panel<br>
      • System Settings<br>
      • Data Reset<br>
      • Maintenance Mode
    </div>

  </div>
</div>

<script>
/* ================= USER DATABASE (FRONTEND ONLY) ================= */
const users = {
  admin: {
    username: "admin",
    password: "admin123",
    role: "admin"
  },
  user: {
    username: "user",
    password: "user123",
    role: "user"
  }
};

/* ================= LOGIN ================= */
function login() {
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  if (u === users.admin.username && p === users.admin.password) {
    loadDashboard("admin");
  }
  else if (u === users.user.username && p === users.user.password) {
    loadDashboard("user");
  }
  else {
    msg.innerText = "❌ Invalid Login";
    msg.style.color = "red";
  }
}

/* ================= DASHBOARD ================= */
function loadDashboard(role) {
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

  const badge = document.getElementById("roleBadge");
  const adminPanel = document.getElementById("adminPanel");

  if (role === "admin") {
    badge.innerText = "ADMIN";
    badge.className = "badge admin";
    adminPanel.style.display = "block";
  } else {
    badge.innerText = "USER";
    badge.className = "badge user";
    adminPanel.style.display = "none";
  }
}

/* ================= LOGOUT ================= */
function logout() {
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginPage").style.display = "flex";
  document.getElementById("msg").innerText = "";
}
</script>

</body>
</html>
