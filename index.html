<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Agriculture Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#0f172a;color:#e5e7eb}
.hidden{display:none}
input,select,button{padding:10px;border-radius:6px;border:none}
button{cursor:pointer}
.card{background:#020617;padding:15px;border-radius:10px;margin:10px 0}
.nav{background:#020617;padding:10px;display:flex;justify-content:space-between}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <h2>🌱 Smart Agriculture Login</h2>
  <form id="loginForm">
    <input id="loginEmail" placeholder="Email" required><br><br>
    <input id="loginPassword" type="password" placeholder="Password" required><br><br>
    <button>Login</button>
  </form>
  <p id="loginMsg"></p>
</div>

<!-- NAVBAR -->
<div class="nav hidden" id="navbar">
  <div>
    <b id="navUserName"></b> (<span id="navUserRole"></span>)
  </div>
  <button onclick="logout()">Logout</button>
</div>

<!-- USER DASHBOARD -->
<div id="userDashboard" class="hidden">
  <h2>User Dashboard</h2>
  <div class="card">Soil Moisture: <span id="soilMoist">--</span></div>
  <div class="card">Soil Temp: <span id="soilTemp">--</span></div>
  <div class="card">Nitrate: <span id="nitrate">--</span></div>
  <div class="card">Air Temp: <span id="airTemp">--</span></div>
  <div class="card">Humidity: <span id="humidity">--</span></div>
  <div class="card">Lightning: <span id="lightning">--</span></div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminDashboard" class="hidden">
  <h2>Admin Dashboard</h2>

  <h3>Add User (DB only)</h3>
  <input id="uName" placeholder="Name">
  <input id="uEmail" placeholder="Email">
  <select id="uRole">
    <option value="user">User</option>
    <option value="admin">Admin</option>
  </select>
  <button onclick="addUser()">Add</button>

  <h3>Users</h3>
  <div id="usersList"></div>
</div>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
  apiKey: "AIzaSyDoqjMw4D-7_GOs0rlFL8oYzInMU8dh2FU",
  authDomain: "smart-agri-4d47c.firebaseapp.com",
  databaseURL: "https://smart-agri-4d47c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "smart-agri-4d47c"
});

const auth = firebase.auth();
const db = firebase.database();

let currentUser, currentData;

/* ================= AUTH ================= */
auth.onAuthStateChanged(async user=>{
  if(!user){ showLogin(); return; }

  currentUser = user;
  const snap = await db.ref("users/"+user.uid).once("value");

  if(!snap.exists()){
    const role = user.email==="admin@agri.com"?"admin":"user";
    await db.ref("users/"+user.uid).set({
      name: role==="admin"?"System Admin":user.email,
      email:user.email,
      role,
      status:"active"
    });
  }

  currentData = (await db.ref("users/"+user.uid).once("value")).val();
  showDashboard();
});

/* ================= LOGIN ================= */
loginForm.onsubmit = async e=>{
  e.preventDefault();
  try{
    await auth.signInWithEmailAndPassword(
      loginEmail.value,
      loginPassword.value
    );
  }catch(err){ loginMsg.innerText = err.message; }
};

/* ================= LOGOUT ================= */
function logout(){ auth.signOut(); }

/* ================= UI ================= */
function showLogin(){
  loginPage.classList.remove("hidden");
  navbar.classList.add("hidden");
  userDashboard.classList.add("hidden");
  adminDashboard.classList.add("hidden");
}

function showDashboard(){
  loginPage.classList.add("hidden");
  navbar.classList.remove("hidden");
  navUserName.innerText = currentData.name;
  navUserRole.innerText = currentData.role;

  if(currentData.role==="admin"){
    adminDashboard.classList.remove("hidden");
    userDashboard.classList.add("hidden");
    loadUsers();
  }else{
    userDashboard.classList.remove("hidden");
    adminDashboard.classList.add("hidden");
    loadSensors();
  }
}

/* ================= USER DATA ================= */
function loadSensors(){
  db.ref("sensors/"+currentUser.uid).on("value",s=>{
    if(!s.exists())return;
    const d=s.val();
    soilMoist.innerText=d.soilMoist+"%";
    soilTemp.innerText=d.soilTemp+"°C";
    nitrate.innerText=d.nitrate;
    airTemp.innerText=d.airTemp+"°C";
    humidity.innerText=d.humidity+"%";
    lightning.innerText=d.lightning.level;
  });
}

/* ================= ADMIN ================= */
async function addUser(){
  const id = db.ref().child("users").push().key;
  await db.ref("users/"+id).set({
    name:uName.value,
    email:uEmail.value,
    role:uRole.value,
    status:"active"
  });
  await db.ref("sensors/"+id).set({
    soilMoist:0,soilTemp:0,nitrate:0,airTemp:0,humidity:0,
    lightning:{level:"Low",intensity:0,total:0}
  });
  loadUsers();
}

async function loadUsers(){
  const snap = await db.ref("users").once("value");
  usersList.innerHTML="";
  snap.forEach(u=>{
    usersList.innerHTML+=`
      <div class="card">
        ${u.val().name} (${u.val().role})
        <button onclick="db.ref('users/${u.key}').remove();db.ref('sensors/${u.key}').remove();loadUsers()">Delete</button>
      </div>`;
  });
}
</script>
</body>
</html>
