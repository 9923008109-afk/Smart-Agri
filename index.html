<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>Smart Agriculture Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!-- Use compatible Firebase version -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#020617;
  --card:#020617;
  --border:#1e293b;
  --accent:#38bdf8;
}
body{
  margin:0;
  font-family:Segoe UI,Arial;
  background:#020617;
  color:#e5e7eb;
}
.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.login-card{
  background:var(--card);
  padding:30px;
  width:330px;
  border-radius:12px;
  box-shadow:0 0 20px rgba(56,189,248,.35);
}
.login-card h2{text-align:center;color:var(--accent)}
input,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
  border:none;
}
button{
  background:var(--accent);
  font-weight:bold;
  cursor:pointer;
}
header{
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}
.badge{
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}
.admin{background:#22c55e;color:black}
.user{background:#facc15;color:black}
.container{
  padding:18px;
  max-width:1200px;
  margin:auto;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
}
.card h3{margin-top:0;color:#93c5fd}
.logout{
  background:#ef4444;
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
}
canvas{
  background:#fff;
  border-radius:8px;
  padding:10px;
  width:100%;
  height:280px;
}
.top-actions{
  display:flex;
  gap:10px;
  align-items:center;
}
.error{color:#f87171;font-size:14px;margin-top:10px;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="center" id="loginPage">
  <div class="login-card">
    <h2>🔐 Smart Agri Login</h2>
    <input id="username" placeholder="Username" value="user">
    <input id="password" type="password" placeholder="Password" value="user123">
    <button onclick="login()">Login</button>
    <p id="msg"></p>
    <div id="firebaseStatus" class="error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">
<header>
  <div>
    Smart Agriculture Dashboard
    <span id="roleBadge" class="badge"></span>
  </div>
  <div class="top-actions">
    <span id="connectionStatus" style="color:#facc15;">● Connecting...</span>
    <span class="logout" onclick="logout()">Logout</span>
  </div>
</header>

<div class="container">

<!-- USER VIEW -->
<div id="userView">
  <div class="grid">

    <div class="card">
      <h3>📅 அடுத்த மாதம் சிறந்த பயிர்</h3>
      🌾 <b id="nextCrop">--</b><br><br>
      🌿 இயற்கை உரம்:<br>
      <b id="fertilizer">--</b>
    </div>

    <div class="card">
      <h3>🌱 நில தகவல் (LIVE)</h3>
      <div id="liveData">Waiting for data…</div>
    </div>

    <div class="card">
      <h3>📊 பருவ விளைச்சல்</h3>
      <canvas id="seasonChart"></canvas>
    </div>

  </div>
</div>

<!-- ADMIN VIEW -->
<div id="adminView" style="margin-top:20px;display:none">
  <div class="card">
    <h3>👑 User-1 Field Data (Graph)</h3>
    <canvas id="adminChart"></canvas>
  </div>
</div>

</div>
</div>

<!-- FIREBASE + LOGIC -->
<script>
// Firebase configuration (using your provided config)
const firebaseConfig = {
  apiKey: "AIzaSyDoqjMw4D-7_GOs0rlFL8oYzInMU8dh2FU",
  authDomain: "smart-agri-4d47c.firebaseapp.com",
  databaseURL: "https://smart-agri-4d47c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "smart-agri-4d47c"
};

// Initialize Firebase
let app;
let db;
let isFirebaseInitialized = false;

try {
  app = firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  isFirebaseInitialized = true;
  document.getElementById('firebaseStatus').innerHTML = "✓ Firebase connected";
  document.getElementById('firebaseStatus').style.color = "#22c55e";
} catch (error) {
  console.error("Firebase initialization error:", error);
  document.getElementById('firebaseStatus').innerHTML = "✗ Firebase error: " + error.message;
}

/* ---------- Globals ---------- */
let role = "";
let adminChart = null;
let seasonChart = null;

/* ---------- Login ---------- */
window.login = () => {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  
  if (!isFirebaseInitialized) {
    msg.innerText = "❌ Firebase not initialized. Check console.";
    msg.style.color = "red";
    return;
  }
  
  // Simple hardcoded login (for demo)
  if (username === "admin" && password === "admin123") {
    role = "admin";
    showDashboard();
    startFirebaseListeners();
  } else if (username === "user" && password === "user123") {
    role = "user";
    showDashboard();
    startFirebaseListeners();
  } else {
    msg.innerText = "❌ தவறான Login";
    msg.style.color = "red";
  }
};

function showDashboard(){
  document.getElementById('loginPage').style.display = "none";
  document.getElementById('dashboard').style.display = "block";
  document.getElementById('roleBadge').innerText = role.toUpperCase();
  document.getElementById('roleBadge').className = "badge " + role;
  document.getElementById('adminView').style.display = (role === "admin") ? "block" : "none";
}

/* ---------- Month-based crop logic ---------- */
function recommendCrop(d){
  const m = new Date().getMonth() + 1;
  const soilMoist = d?.soilMoist || 50;

  if (m>=6 && m<=9 && soilMoist>55)
    return { crop:"நெல் (Rice)", fert:"பஞ்சகவ்யா + மாட்டு சாணம்" };

  if (m>=2 && m<=3 && soilMoist<45)
    return { crop:"கடலை (Groundnut)", fert:"வேப்பம் புண்ணாக்கு" };

  if (m>=4 && m<=5)
    return { crop:"சோளம் (Maize)", fert:"ஜீவாமிர்தம்" };

  return { crop:"காய்கறிகள்", fert:"கம்போஸ்ட் உரம்" };
}

/* ---------- Firebase listeners ---------- */
function startFirebaseListeners() {
  if (!isFirebaseInitialized) {
    console.error("Firebase not initialized");
    return;
  }

  // Update connection status
  const connectedRef = firebase.database().ref(".info/connected");
  connectedRef.on("value", function(snap) {
    const statusEl = document.getElementById('connectionStatus');
    if (snap.val() === true) {
      statusEl.innerHTML = "● Connected";
      statusEl.style.color = "#22c55e";
    } else {
      statusEl.innerHTML = "● Disconnected";
      statusEl.style.color = "#ef4444";
    }
  });

  /* Field live data - Test with a simpler path first */
  const fieldRef = firebase.database().ref("agri");
  fieldRef.on("value", function(snap) {
    console.log("Firebase data received:", snap.val());
    
    const allData = snap.val();
    if (!allData) {
      document.getElementById('liveData').innerHTML = "❌ No data in Firebase. Please add data to 'agri/field1'";
      return;
    }
    
    // Check different possible data structures
    let fieldData = allData.field1 || allData.Field1 || allData;
    
    if (fieldData) {
      document.getElementById('liveData').innerHTML = `
        🌱 மண் ஈரப்பதம்: <b>${fieldData.soilMoist || 0}%</b><br>
        🌡 வெப்பநிலை: <b>${fieldData.soilTemp || 0}°C</b><br>
        💧 ஈரப்பதம்: <b>${fieldData.humidity || 0}%</b><br>
        🧪 நைட்ரேட்: <b>${fieldData.nitrate || 0}</b><br>
        ⚡ மின்னல்: <b>${fieldData.lightning?.level || "-"}</b>
      `;

      const rec = recommendCrop(fieldData);
      document.getElementById('nextCrop').innerText = rec.crop;
      document.getElementById('fertilizer').innerText = rec.fert;

      if (role === "admin") {
        const adminChartEl = document.getElementById('adminChart').getContext('2d');
        if (adminChart) adminChart.destroy();
        adminChart = new Chart(adminChartEl, {
          type:"bar",
          data:{
            labels:["Soil Moisture","Temperature","Humidity","Nitrate"],
            datasets:[{
              label:"User-1 Field Data",
              data:[
                fieldData.soilMoist || 0,
                fieldData.soilTemp || 0,
                fieldData.humidity || 0,
                fieldData.nitrate || 0
              ],
              backgroundColor:"#22c55e"
            }]
          },
          options:{
            responsive:true,
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });
      }
    }
  }, function(error) {
    console.error("Firebase read failed:", error);
    document.getElementById('liveData').innerHTML = `❌ Error: ${error.message}`;
  });

  /* Seasonal chart data */
  const seasonRef = firebase.database().ref("agri/seasonal");
  seasonRef.on("value", function(snap) {
    const seasonData = snap.val();
    console.log("Seasonal data:", seasonData);
    
    if (seasonData) {
      const seasonChartEl = document.getElementById('seasonChart').getContext('2d');
      if (seasonChart) seasonChart.destroy();
      seasonChart = new Chart(seasonChartEl, {
        type:"line",
        data:{
          labels:Object.keys(seasonData),
          datasets:[{
            label:"Seasonal Yield %",
            data:Object.values(seasonData),
            borderColor:"#38bdf8",
            backgroundColor:"rgba(56,189,248,0.1)",
            fill:true,
            tension:0.4
          }]
        },
        options:{
          responsive:true,
          scales: {
            y: {
              beginAtZero: true,
              max: 100
            }
          }
        }
      });
    }
  });
}

/* ---------- Logout ---------- */
window.logout = () => {
  // Clean up Firebase listeners
  if (isFirebaseInitialized) {
    firebase.database().ref("agri").off();
    firebase.database().ref("agri/seasonal").off();
    firebase.database().ref(".info/connected").off();
  }
  
  document.getElementById('dashboard').style.display = "none";
  document.getElementById('loginPage').style.display = "flex";
  role = "";
};

// Add test data function (for debugging)
window.addTestData = function() {
  if (!isFirebaseInitialized) return;
  
  const testData = {
    soilMoist: 65,
    soilTemp: 28,
    humidity: 75,
    nitrate: 45,
    lightning: { level: "Low" }
  };
  
  const seasonalData = {
    "Summer": 85,
    "Monsoon": 95,
    "Winter": 65,
    "Spring": 75
  };
  
  firebase.database().ref("agri/field1").set(testData);
  firebase.database().ref("agri/seasonal").set(seasonalData);
  
  alert("Test data added to Firebase!");
};
</script>

</body>
</html>
